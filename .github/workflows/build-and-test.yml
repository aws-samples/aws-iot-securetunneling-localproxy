name: Build and Test Multi-Platform

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Dependencies come from the versions pinned in fc_deps.json, resolved by
  # CMake's FetchContent (LOCALPROXY_DEP_MODE=fetch). Only the download staging
  # dirs are cached, keyed on the manifest alone -- no per-dependency version is
  # restated here. System-mode resolution is covered by the base-image
  # Dockerfiles, which preinstall the deps and configure with a bare `cmake ..`.
  build-linux:
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run:
          sudo apt-get update && sudo apt-get install -y build-essential cmake
          git curl libssl-dev zlib1g-dev

      # Only the downloaded archives are cached, not the extracted *-src trees:
      # re-extracting is far cheaper than re-downloading, and caching the trees
      # too would multiply the entry against the repository's shared 10 GB
      # Actions cache budget. cmake/LocalproxyDeps.cmake pins the download
      # location so this path does not depend on FetchContent internals.
      - name: Cache fetched dependency sources
        uses: actions/cache@v6
        with:
          path: build/_deps/downloads
          key:
            linux-${{ matrix.arch }}-fcdeps-${{ hashFiles('fc_deps.json') }}-v1

      - name: Build
        run: |
          mkdir -p build && cd build
          cmake .. -DBUILD_TESTS=ON -DLINK_STATIC_OPENSSL=OFF -DLOCALPROXY_DEP_MODE=fetch
          make -j$(nproc)

      - name: Run tests
        run: ./build/bin/localproxytest

      # src/main.cpp is not linked into the unit-test binary, so CLI argument
      # handling is covered by this UAT instead. It needs no AWS credentials,
      # which is why it runs here rather than in the UAT workflow.
      - name: Run CLI argument tests
        run: |
          chmod +x uat/test_cli_usage.sh uat/lib/*.sh
          ./uat/test_cli_usage.sh

      # protoc and other dependency tools must never land in build/bin: the
      # release Dockerfiles copy that directory wholesale.
      - name: Assert build/bin holds only the localproxy binaries
        run: |
          actual=$(ls build/bin | sort | tr '\n' ' ')
          expected="localproxy localproxytest "
          if [ "$actual" != "$expected" ]; then
            echo "build/bin contains unexpected entries: $actual"
            exit 1
          fi

      - name: Strip binary
        run: strip build/bin/localproxy

  build-linux-arm32:
    permissions:
      contents: read
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm

      # Cross-building Boost and Protobuf under QEMU is slow, so the FetchContent
      # download staging dirs are cached. Keyed on fc_deps.json alone: the
      # manifest is the only place the versions live.
      - name: Cache fetched dependency sources
        uses: actions/cache@v6
        with:
          path: build/_deps/downloads
          key: arm32-fcdeps-${{ hashFiles('fc_deps.json') }}-v1

      - name: Build in ARM32 container
        run: |
          docker run --rm --platform linux/arm/v7 \
            -v ${{ github.workspace }}:/src \
            -w /src \
            arm32v7/ubuntu:22.04 bash -c '
              apt-get update && apt-get install -y build-essential cmake git curl libssl-dev zlib1g-dev
              mkdir -p build && cd build
              cmake .. -DBUILD_TESTS=ON -DLINK_STATIC_OPENSSL=OFF -DLOCALPROXY_DEP_MODE=fetch
              make -j$(nproc)
            '

      - name: Run tests in ARM32 container
        run: |
          docker run --rm --platform linux/arm/v7 \
            -v ${{ github.workspace }}:/src \
            -w /src \
            arm32v7/ubuntu:22.04 bash -c '
              apt-get update && apt-get install -y libssl-dev
              ./build/bin/localproxytest
            '

      - name: Strip binary in ARM32 container
        run: |
          docker run --rm --platform linux/arm/v7 \
            -v ${{ github.workspace }}:/src \
            -w /src \
            arm32v7/ubuntu:22.04 bash -c '
              apt-get update && apt-get install -y binutils
              strip build/bin/localproxy
            '

  build-macos:
    permissions:
      contents: read
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: brew install cmake openssl@3 zlib

      - name: Cache fetched dependency sources
        uses: actions/cache@v6
        with:
          path: build/_deps/downloads
          key: macos-arm64-fcdeps-${{ hashFiles('fc_deps.json') }}-v1

      - name: Build
        run: |
          mkdir -p build && cd build
          cmake .. -DBUILD_TESTS=ON -DCMAKE_PREFIX_PATH="$(brew --prefix openssl@3)" -DLINK_STATIC_OPENSSL=OFF -DLOCALPROXY_DEP_MODE=fetch -DLOCALPROXY_RELEASE=ON
          make -j$(sysctl -n hw.ncpu)

      - name: Run tests
        run: ./build/bin/localproxytest

      - name: Strip binary
        run: strip build/bin/localproxy

      # Note: Binary is not code-signed. macOS users may need to run:
      # xattr -d com.apple.quarantine localproxy-macos-arm64
      # Or right-click the binary and select "Open" to bypass Gatekeeper
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: localproxy-macos-arm64
          path: build/bin/localproxy

  build-windows:
    permissions:
      contents: read
      actions: write
    runs-on: windows-2022
    env:
      DEPS_DIR: ${{ github.workspace }}\deps
      # OpenSSL and zlib are deliberately absent from fc_deps.json (they come
      # from the platform), so they are still built here. Boost, Protobuf and
      # Catch2 come from the manifest via FetchContent.
      OPENSSL_VERSION: "3.0.12"
      ZLIB_VERSION: "1.2.13"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup developer command prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Restore Windows dependencies cache
        id: cache-windows-deps
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.DEPS_DIR }}
          key:
            windows-deps-openssl${{ env.OPENSSL_VERSION }}-zlib${{
            env.ZLIB_VERSION }}-v1

      - name: Cache fetched dependency sources
        uses: actions/cache@v6
        with:
          path: build/_deps/downloads
          key: windows-fcdeps-${{ hashFiles('fc_deps.json') }}-v1

      - name: Install OpenSSL
        if: steps.cache-windows-deps.outputs.cache-hit != 'true'
        run: |
          New-Item -ItemType Directory -Force -Path $env:DEPS_DIR
          Invoke-WebRequest "https://www.nasm.us/pub/nasm/releasebuilds/2.15.05/win64/nasm-2.15.05-win64.zip" -OutFile "nasm-2.15.05-win64.zip"
          Expand-Archive "nasm-2.15.05-win64.zip" -Force -DestinationPath "C:\NASM"
          $env:Path += ";C:\NASM\nasm-2.15.05\"
          Invoke-WebRequest "https://github.com/openssl/openssl/archive/refs/tags/openssl-$env:OPENSSL_VERSION.zip" -OutFile "openssl.zip"
          Expand-Archive "openssl.zip" -Force
          cd .\openssl\openssl-openssl-$env:OPENSSL_VERSION\
          perl Configure VC-WIN64A --prefix="$env:DEPS_DIR\openssl" --openssldir="$env:DEPS_DIR\openssl\ssl"
          nmake
          nmake install_sw

      - name: Install zlib
        if: steps.cache-windows-deps.outputs.cache-hit != 'true'
        run: |
          git clone -b v$env:ZLIB_VERSION https://github.com/madler/zlib.git
          cd zlib
          mkdir build
          cd build
          cmake -G "NMake Makefiles" -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$env:DEPS_DIR\zlib" ../
          nmake
          nmake install

      - name: Save Windows dependencies cache
        if: steps.cache-windows-deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.DEPS_DIR }}
          key:
            windows-deps-openssl${{ env.OPENSSL_VERSION }}-zlib${{
            env.ZLIB_VERSION }}-v1

      - name: Build
        run: |
          mkdir build
          cd build
          $prefixPath = "$env:DEPS_DIR\openssl;$env:DEPS_DIR\zlib"
          cmake -DBUILD_TESTS=ON -DLINK_STATIC_OPENSSL=OFF -DWIN32_WINNT=0x0A00 -DBoost_USE_STATIC_LIBS=ON -DLOCALPROXY_DEP_MODE=fetch -DLOCALPROXY_RELEASE=ON "-DCMAKE_PREFIX_PATH=$prefixPath" -G "Visual Studio 17 2022" -A x64 ..
          msbuild localproxy.vcxproj -p:Configuration=Release

      - name: Build tests
        run: msbuild build\localproxytest.vcxproj -p:Configuration=Release

      - name: Run tests
        run: .\build\bin\Release\localproxytest.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: localproxy-windows-x64
          path: build/bin/Release/localproxy.exe

  # System-mode resolution (deps preinstalled, bare `cmake ..`) is covered by the
  # base-image Dockerfiles in .github/docker-images/base-images/, which the
  # release images build from. This workflow exercises fetch mode.
