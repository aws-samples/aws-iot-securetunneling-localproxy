name: UAT Tests and Release Artifacts

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build:
    if:
      github.repository == 'aws-samples/aws-iot-securetunneling-localproxy' &&
      github.event.pull_request.head.repo.fork != true
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run:
          sudo apt-get update && sudo apt-get install -y build-essential cmake
          wget git libssl-dev zlib1g-dev netcat-openbsd jq sshpass
          openssh-server

      - name: Setup SSH server for UAT
        run: |
          sudo useradd -m -s /bin/bash testuser || true
          echo "testuser:${{ secrets.UAT_SSH_PASS }}" | sudo chpasswd
          sudo mkdir -p /home/testuser/.ssh
          ssh-keygen -t rsa -N "" -f /tmp/uat_ssh_key
          sudo cp /tmp/uat_ssh_key.pub /home/testuser/.ssh/authorized_keys
          sudo chown -R testuser:testuser /home/testuser/.ssh
          sudo chmod 700 /home/testuser/.ssh
          sudo chmod 600 /home/testuser/.ssh/authorized_keys
          echo "PasswordAuthentication yes" | sudo tee /etc/ssh/sshd_config.d/uat.conf
          sudo systemctl restart ssh

      # Dependencies come from the versions pinned in fc_deps.json; only the
      # download staging dirs are cached, keyed on the manifest alone.
      - name: Cache fetched dependency sources
        uses: actions/cache@v6
        with:
          path: build/_deps/downloads
          key:
            linux-${{ matrix.arch }}-fcdeps-${{ hashFiles('fc_deps.json') }}-v1

      - name: Build
        run: |
          mkdir -p build && cd build
          cmake .. -DBUILD_TESTS=OFF -DCMAKE_BUILD_TYPE=MinSizeRel -DLINK_STATIC_OPENSSL=OFF -DLOCALPROXY_DEP_MODE=fetch
          make -j$(nproc)

      - name: Strip binary
        run: strip build/bin/localproxy

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume:
            arn:aws:iam::${{ vars.AWS_ACCOUNT }}:role/${{ secrets.ROLE_NAME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Run UAT tests
        env:
          SSH_USER: testuser
          SSH_KEY: /tmp/uat_ssh_key
          SSH_PASS: ${{ secrets.UAT_SSH_PASS }}
        run: |
          chmod +x uat/*.sh uat/lib/*.sh
          ./uat/run_uat.sh
          ./uat/test_lifecycle.sh
          ./uat/test_multiport.sh
          ./uat/test_multiplex_integrity.sh
          ./uat/test_v1_compat.sh
          ./uat/test_ssh_connectivity.sh

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: uat-logs-${{ matrix.arch }}
          path: uat/logs/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: localproxy-linux-${{ matrix.arch }}
          path: build/bin/localproxy

  build-arm32:
    if:
      github.repository == 'aws-samples/aws-iot-securetunneling-localproxy' &&
      github.event.pull_request.head.repo.fork != true
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm

      # Cross-building under QEMU is slow, so the FetchContent download staging
      # dirs are cached. Keyed on fc_deps.json alone: the manifest is the only
      # place the dependency versions live.
      - name: Cache fetched dependency sources
        uses: actions/cache@v6
        with:
          path: build/_deps/downloads
          key: arm32-fcdeps-${{ hashFiles('fc_deps.json') }}-v1

      - name: Build in ARM32 container
        run: |
          docker run --rm --platform linux/arm/v7 \
            -v ${{ github.workspace }}:/src \
            -w /src \
            arm32v7/ubuntu:22.04 bash -c '
              apt-get update && apt-get install -y build-essential cmake git curl libssl-dev zlib1g-dev
              mkdir -p build && cd build
              cmake .. -DBUILD_TESTS=OFF -DCMAKE_BUILD_TYPE=MinSizeRel -DLINK_STATIC_OPENSSL=OFF -DLOCALPROXY_DEP_MODE=fetch
              make -j$(nproc)
              strip bin/localproxy
            '

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume:
            arn:aws:iam::${{ vars.AWS_ACCOUNT }}:role/${{ secrets.ROLE_NAME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Run UAT tests in ARM32 container
        env:
          AWS_ACCESS_KEY_ID: ${{ env.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ env.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ env.AWS_SESSION_TOKEN }}
        run: |
          docker run --rm --platform linux/arm/v7 \
            -v ${{ github.workspace }}:/src \
            -w /src \
            -e AWS_REGION=${{ vars.AWS_REGION }} \
            -e AWS_ACCESS_KEY_ID \
            -e AWS_SECRET_ACCESS_KEY \
            -e AWS_SESSION_TOKEN \
            arm32v7/ubuntu:22.04 bash -c '
              apt-get update && apt-get install -y libssl-dev jq netcat-openbsd python3-pip
              pip3 install awscli
              chmod +x uat/*.sh uat/lib/*.sh
              ./uat/run_uat.sh
              ./uat/test_lifecycle.sh
              ./uat/test_multiport.sh
              ./uat/test_multiplex_integrity.sh
              ./uat/test_v1_compat.sh
            '

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: uat-logs-armv7
          path: uat/logs/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: localproxy-linux-armv7
          path: build/bin/localproxy
