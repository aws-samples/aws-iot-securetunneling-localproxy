name: UAT Tests and Release Artifacts

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build:
    if:
      github.repository == 'aws-samples/aws-iot-securetunneling-localproxy' &&
      github.event.pull_request.head.repo.fork != true
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run:
          sudo apt-get update && sudo apt-get install -y build-essential cmake
          wget git libssl-dev zlib1g-dev netcat-openbsd jq sshpass
          openssh-server

      - name: Setup SSH server for UAT
        run: |
          sudo useradd -m -s /bin/bash testuser || true
          echo "testuser:${{ secrets.UAT_SSH_PASS }}" | sudo chpasswd
          sudo mkdir -p /home/testuser/.ssh
          ssh-keygen -t rsa -N "" -f /tmp/uat_ssh_key
          sudo cp /tmp/uat_ssh_key.pub /home/testuser/.ssh/authorized_keys
          sudo chown -R testuser:testuser /home/testuser/.ssh
          sudo chmod 700 /home/testuser/.ssh
          sudo chmod 600 /home/testuser/.ssh/authorized_keys
          echo "PasswordAuthentication yes" | sudo tee /etc/ssh/sshd_config.d/uat.conf
          sudo systemctl restart ssh

      # Dependencies come from the versions pinned in fc_deps.json; only the
      # download staging dirs are cached, keyed on the manifest alone.
      - name: Cache fetched dependency sources
        uses: actions/cache@v6
        with:
          path: build/_deps/downloads
          key:
            linux-${{ matrix.arch }}-fcdeps-${{ hashFiles('fc_deps.json') }}-v1

      - name: Build
        run: |
          mkdir -p build && cd build
          cmake .. -DBUILD_TESTS=OFF -DCMAKE_BUILD_TYPE=MinSizeRel -DLINK_STATIC_OPENSSL=OFF -DLOCALPROXY_DEP_MODE=fetch -DLOCALPROXY_RELEASE=ON
          make -j$(nproc)

      - name: Strip binary
        run: strip build/bin/localproxy

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume:
            arn:aws:iam::${{ vars.AWS_ACCOUNT }}:role/${{ secrets.ROLE_NAME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Run UAT tests
        env:
          SSH_USER: testuser
          SSH_KEY: /tmp/uat_ssh_key
          SSH_PASS: ${{ secrets.UAT_SSH_PASS }}
        run: |
          chmod +x uat/*.sh uat/lib/*.sh
          ./uat/run_uat.sh
          ./uat/test_lifecycle.sh
          ./uat/test_multiport.sh
          ./uat/test_multiplex_integrity.sh
          ./uat/test_v1_compat.sh
          ./uat/test_ssh_connectivity.sh

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: uat-logs-${{ matrix.arch }}
          path: uat/logs/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: localproxy-linux-${{ matrix.arch }}
          path: build/bin/localproxy

  build-arm32:
    if:
      github.repository == 'aws-samples/aws-iot-securetunneling-localproxy' &&
      github.event.pull_request.head.repo.fork != true
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # QEMU only runs the arm32 binary for UAT; the build is a cross-compile.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm

      - name: Install armhf cross toolchain and multiarch sysroot
        run: |
          sudo dpkg --add-architecture armhf
          # The runner's sources use "deb mirror+file:...", not an http URL, so match any
          # scheme: left unscoped, armhf 404s on the amd64-only mirrors and apt fails.
          for f in /etc/apt/sources.list /etc/apt/sources.list.d/*.list; do
            [ -e "$f" ] || continue
            sudo sed -i -E '/^deb .*arch=/! { s|^deb \[([^]]*)\] (\S+)|deb [arch=amd64 \1] \2|; t; s|^deb (\S+)|deb [arch=amd64] \1|; }' "$f"
          done
          # armhf is served from ports.ubuntu.com, not archive.ubuntu.com.
          sudo tee /etc/apt/sources.list.d/armhf-ports.list >/dev/null <<'PORTS'
          deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports/ jammy main restricted universe multiverse
          deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports/ jammy-updates main restricted universe multiverse
          deb [arch=armhf] http://ports.ubuntu.com/ubuntu-ports/ jammy-security main restricted universe multiverse
          PORTS
          sudo apt-get update
          sudo apt-get install -y crossbuild-essential-armhf cmake git curl unzip libssl-dev:armhf zlib1g-dev:armhf

      # Generated .pb.h has a PROTOBUF_MIN_PROTOC_VERSION guard, so the host protoc must
      # match fc_deps.json; Ubuntu's 3.12.4 would #error against the pinned 3.17.3.
      - name: Install host protoc matching fc_deps.json
        run: |
          VER=$(jq -r .protobuf.version fc_deps.json)
          echo "Installing host protoc $VER"
          curl -fsSL -o /tmp/protoc.zip \
            "https://github.com/protocolbuffers/protobuf/releases/download/v$VER/protoc-$VER-linux-x86_64.zip"
          # unzip drops the execute bit; restore it before the smoke test (else exit 126).
          sudo unzip -o /tmp/protoc.zip -d /usr/local 'bin/protoc' 'include/*'
          sudo chmod +x /usr/local/bin/protoc
          protoc --version

      - name: Write armhf multiarch toolchain file
        run: |
          cat > /tmp/armhf-multiarch.cmake <<'TOOLCHAIN'
          set(CMAKE_SYSTEM_NAME      Linux)
          set(CMAKE_SYSTEM_PROCESSOR arm)

          set(CMAKE_C_COMPILER   arm-linux-gnueabihf-gcc)
          set(CMAKE_CXX_COMPILER arm-linux-gnueabihf-g++)

          # No CMAKE_SYSROOT: multiarch puts armhf under the host root, and the cross gcc's
          # auto-detected CMAKE_LIBRARY_ARCHITECTURE steers find_package(OpenSSL) to it.

          # BOTH, not ONLY: there is no sysroot tree, so ONLY would hide /usr/include.
          set(CMAKE_FIND_ROOT_PATH_MODE_PROGRAM NEVER)
          set(CMAKE_FIND_ROOT_PATH_MODE_LIBRARY BOTH)
          set(CMAKE_FIND_ROOT_PATH_MODE_INCLUDE BOTH)
          set(CMAKE_FIND_ROOT_PATH_MODE_PACKAGE BOTH)

          set(ENV{PKG_CONFIG_LIBDIR} /usr/lib/arm-linux-gnueabihf/pkgconfig:/usr/share/pkgconfig)
          TOOLCHAIN

      - name: Cache fetched dependency sources
        uses: actions/cache@v6
        with:
          path: build/_deps/downloads
          key: arm32-fcdeps-${{ hashFiles('fc_deps.json') }}-v1

      - name: Cross-compile arm32 binary
        run: |
          mkdir -p build && cd build
          cmake .. -DCMAKE_TOOLCHAIN_FILE=/tmp/armhf-multiarch.cmake -DBUILD_TESTS=OFF -DCMAKE_BUILD_TYPE=MinSizeRel -DLINK_STATIC_OPENSSL=OFF -DLOCALPROXY_DEP_MODE=fetch -DLOCALPROXY_PROTOC_EXECUTABLE=/usr/local/bin/protoc -DLOCALPROXY_RELEASE=ON
          make -j"$(nproc)"

      - name: Strip binary
        run: arm-linux-gnueabihf-strip build/bin/localproxy

      # Assert 32-bit ARM so a silent host-native build cannot pass.
      - name: Verify binary is 32-bit ARM
        run: |
          file build/bin/localproxy
          file build/bin/localproxy | grep -q 'ELF 32-bit LSB.*ARM'

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume:
            arn:aws:iam::${{ vars.AWS_ACCOUNT }}:role/${{ secrets.ROLE_NAME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Run UAT tests in ARM32 container
        env:
          AWS_ACCESS_KEY_ID: ${{ env.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ env.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ env.AWS_SESSION_TOKEN }}
        run: |
          docker run --rm --platform linux/arm/v7 \
            -v ${{ github.workspace }}:/src \
            -w /src \
            -e AWS_REGION=${{ vars.AWS_REGION }} \
            -e AWS_ACCESS_KEY_ID \
            -e AWS_SECRET_ACCESS_KEY \
            -e AWS_SESSION_TOKEN \
            arm32v7/ubuntu:22.04 bash -c '
              apt-get update && apt-get install -y libssl-dev jq netcat-openbsd python3-pip
              pip3 install awscli
              chmod +x uat/*.sh uat/lib/*.sh
              ./uat/run_uat.sh
              ./uat/test_lifecycle.sh
              ./uat/test_multiport.sh
              ./uat/test_multiplex_integrity.sh
              ./uat/test_v1_compat.sh
            '

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: uat-logs-armv7
          path: uat/logs/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: localproxy-linux-armv7
          path: build/bin/localproxy
