name: "CodeQL C++ Build"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "33 8 * * 1" # Example: Run 8:33 UTC every Monday

jobs:
  analyze:
    name: Analyze (C++)
    runs-on: ubuntu-latest
    permissions:
      security-events: write # required to upload CodeQL results
      actions: read # required for private repositories
      contents: read # required to check out the code
      packages: read # required to fetch internal or private CodeQL packs (if used)

    strategy:
      fail-fast: false
      matrix:
        language: ["c-cpp"]
        build-mode: ["manual"] # Using manual build steps

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history

      # === Dependency Installation Steps ===
      - name: Install apt-get dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            build-essential \
            git \
            python3-dev \
            wget \
            tar \
            zlib1g-dev \
            libssl-dev \
            openssl \
            cmake
          sudo apt-get clean -y

      # Boost and Protobuf come from the versions pinned in fc_deps.json,
      # resolved by CMake's FetchContent during the build step below.
      - name: Cache fetched dependency sources
        uses: actions/cache@v5
        with:
          path: build/_deps/downloads
          key: codeql-fcdeps-${{ hashFiles('fc_deps.json') }}-v1

      # Initialize CodeQL BEFORE the project build
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # queries: security-extended,security-and-quality # Optional

      # === Build Project Steps ===
      - name: Build localproxy project
        shell: bash
        run: |
          echo "Creating build directory for localproxy..."
          mkdir build
          cd build
          echo "Configuring localproxy with CMake (tests disabled)..."
          # Ensure BUILD_TESTS=OFF is used
          cmake .. -DBUILD_TESTS=OFF -DCMAKE_BUILD_TYPE=Release -DLOCALPROXY_DEP_MODE=fetch
          echo "Building localproxy with make..."
          make -j$(nproc)

      # Perform the CodeQL analysis AFTER the build is complete
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{matrix.language}}"
